name: .NET

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/RequirementDrivenApi/RequirementDrivenApi.csproj
      - run: dotnet build src/RequirementDrivenApi/RequirementDrivenApi.csproj --no-restore
      - name: Smoke-test health endpoint
        shell: bash
        run: |
          dotnet run --project src/RequirementDrivenApi/RequirementDrivenApi.csproj --no-build --no-launch-profile --urls http://127.0.0.1:5080 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health | grep -q '"status":"Healthy"'; then
              exit 0
            fi
            sleep 1
          done

          echo "Health endpoint did not return a healthy response."
          exit 1
